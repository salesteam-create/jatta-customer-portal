# Kept for the day GitHub Pages is switched to the "GitHub Actions" source.
#
# It is manual-only today because Pages on this repository is currently set to
# "Deploy from a branch", which serves the repository root. The built site is
# committed to the root for that reason, and `npm run publish:pages` refreshes it.
#
# To move to this workflow instead:
#   1. Settings, Pages, Source, choose "GitHub Actions".
#   2. Run this workflow once from the Actions tab.
#   3. Delete index.html, assets/ and .nojekyll from the repository root.
#
# Note: actions/configure-pages with `enablement: true` does not work here. The
# default Actions token cannot create a Pages site, which is what failed on the
# first attempt ("Resource not accessible by integration").

name: Deploy prototype to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
